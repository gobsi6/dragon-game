<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용의 대륙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --surface: #F7F7F5;
    --surface-2: #FCFCFB;
    --ink: #1F2326;
    --ink-2: #4E5358;
    --muted: #5B6066;
    --line: #9A9C98;
    --line-soft: #C4C6C2;
    --line-in: #DDDFDB;
    --orn: #7E8389;
    --steel: #3C5A73;
    --steel-d: #2A4256;
    --steel-l: #9DB3C6;
    --forest: #3A6B50;

    --k-black: #6E5E92;  --t-black: #4A3D66;
    --k-gold: #B8913A;   --t-gold: #7A5A16;
    --k-white: #6F9BBC;  --t-white: #2C4F6B;
    --k-green: #5E8A55;  --t-green: #3B5E33;

    --serif: 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
    --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font: 15px/1.6 var(--sans);
    word-break: keep-all;
    background-color: #DDE1E3;
    background-image:
      radial-gradient(ellipse 110% 60% at 50% 0%, #F7F8F8 0%, rgba(247, 248, 248, 0) 65%),
      radial-gradient(ellipse 70% 50% at 100% 100%, rgba(148, 166, 184, .28) 0%, rgba(148, 166, 184, 0) 70%),
      linear-gradient(180deg, #ECEEEE 0%, #E1E4E5 50%, #D2D8DC 100%);
    background-attachment: fixed;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ── 장식 액자 ── */
  .frame {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--line-in);
  }
  .frame > .c { position: absolute; width: 8px; height: 8px; background: var(--orn); border: 1px solid var(--surface); transform: rotate(45deg); }
  .frame > .tl { top: -5px; left: -5px; } .frame > .tr { top: -5px; right: -5px; }
  .frame > .bl { bottom: -5px; left: -5px; } .frame > .br { bottom: -5px; right: -5px; }
  .orn-h { display: flex; align-items: center; gap: 10px; }
  .orn-h::before, .orn-h::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .orn-h h2 { margin: 0; font: 700 15px/1.4 var(--serif); color: var(--steel-d); display: flex; align-items: center; gap: 10px; }
  .orn-h h2::before, .orn-h h2::after { content: ""; width: 5px; height: 5px; background: var(--orn); transform: rotate(45deg); }

  .btn {
    min-height: 42px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    box-shadow: inset 0 0 0 2px var(--surface-2), inset 0 0 0 3px #E0E2DE;
    font-weight: 500;
  }
  .btn:hover { border-color: var(--steel); }
  .btn.primary { background: var(--steel); color: #F4F7FA; border-color: var(--steel-d); box-shadow: inset 0 0 0 1px var(--steel-l); font-weight: 600; }
  .btn.green { background: var(--forest); color: #F4F7FA; border-color: #2B5240; box-shadow: inset 0 0 0 1px #8FB89F; font-weight: 600; }
  .btn .cost { font-size: 12px; color: var(--muted); }
  .btn.primary .cost { color: #D5E0EA; }
  .btn svg { flex: none; }

  .field { display: grid; gap: 4px; }
  .field span { font-size: 13px; color: var(--muted); }
  .input {
    min-height: 44px; padding: 0 12px;
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 3px;
  }

  /* ── 로그인 · 드래곤 만들기 ── */
  .gate { max-width: 440px; margin: 10vh auto 40px; padding: 32px 30px 30px; }
  .gate.wide { max-width: 780px; margin-top: 6vh; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .t { font: 700 22px/1.2 var(--serif); letter-spacing: .06em; }
  .brand .s { font-size: 12px; color: var(--muted); }
  .gate .brand { justify-content: center; margin-bottom: 6px; }
  .gate .brand .t { font-size: 30px; }
  .gate h1 { font: 700 26px/1.3 var(--serif); text-align: center; margin: 0 0 6px; }
  .lead { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .gate form { display: grid; gap: 14px; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .error { color: #A63E4B; font-size: 14px; min-height: 1.4em; margin: 0; }

  .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .kind {
    text-align: left; padding: 14px; display: grid; gap: 4px; align-content: start;
    background: var(--surface-2); border: 1px solid var(--line-in); border-radius: 3px;
  }
  .kind .ring { width: 30px; height: 30px; border-radius: 50%; background: #E3E6E8; box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px var(--c); margin: 4px 0 6px 4px; }
  .kind strong { font: 700 17px/1.3 var(--serif); }
  .kind small { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .kind[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); background: #fff; }

  /* ── 상단 상태 바 ── */
  .top { background: rgba(250, 250, 249, .72); backdrop-filter: blur(6px); border-bottom: 3px double var(--line); position: relative; z-index: 5; }
  .top .in { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px 0 10px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 3px; }
  .chip .l { font-size: 13px; color: var(--muted); }
  .chip .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .iconbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 3px; color: #363B40; }
  .iconbtn:hover { border-color: var(--line-soft); }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 48px; min-width: 160px; padding: 6px; display: grid; }
  .menu button { text-align: left; min-height: 40px; padding: 0 12px; background: transparent; border: 0; border-radius: 2px; }
  .menu button:hover { background: #ECEEEC; }

  /* ── 본문 ── */
  .main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .profile { flex: 1 1 270px; max-width: 300px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .center { flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .side { flex: 1 1 250px; max-width: 290px; align-self: stretch; display: flex; flex-direction: column; padding: 18px 8px 8px; }

  .portrait {
    position: relative; height: 300px; width: 100%; padding: 0; overflow: hidden;
    border: 1px solid var(--orn); border-radius: 140px 140px 2px 2px;
    box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px #CDCFCB;
    background: #E8E9E6; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .portrait img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); object-fit: cover; border-radius: 135px 135px 0 0; }
  .portrait .hint { font-size: 13px; }
  .portrait .over { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); padding: 4px 12px; background: rgba(31, 35, 38, .7); color: #F4F7FA; font-size: 12px; border-radius: 2px; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .portrait:hover .over, .portrait:focus-visible .over { opacity: 1; }
  .nameplate {
    margin: -34px 14px 0; padding: 10px 14px 11px; position: relative;
    background: var(--surface); border: 1px solid var(--orn);
    box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px var(--line-in);
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  }
  .nameplate .n { font: 700 23px/1.2 var(--serif); overflow-wrap: anywhere; }
  .nameplate .sub { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .lv { padding: 0 7px; background: var(--steel); color: #F4F7FA; font-weight: 600; font-size: 12px; line-height: 19px; border-radius: 2px; }
  .xp { align-self: stretch; display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
  .xp .bar { height: 3px; border-radius: 2px; background: #E1E3E0; }
  .xp .bar i { display: block; height: 100%; border-radius: 2px; background: var(--orn); }
  .xp .t { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .vitals { display: flex; flex-direction: column; gap: 12px; }
  .vital { display: flex; flex-direction: column; gap: 6px; }
  .vital .h { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .vital .h .l { color: var(--ink-2); }
  .vital .h .v { margin-left: auto; font-variant-numeric: tabular-nums; }
  .vital .h .v b { font-weight: 600; }
  .vital .h .v span { color: #6A7076; }
  .vital .bar { height: 6px; border-radius: 3px; background: #E1E3E0; box-shadow: inset 0 1px 1px rgba(31, 35, 38, .14); }
  .vital .bar i { display: block; height: 100%; border-radius: 3px; transition: width .3s; }
  .attrs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px double var(--line-soft); border-bottom: 3px double var(--line-soft); padding: 12px 0 10px; }
  .attr { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .attr + .attr { border-left: 1px solid var(--line-in); }
  .attr b { font: 700 20px/1.2 var(--serif); }
  .attr span { font-size: 12px; color: var(--muted); }
  .stance { display: flex; flex-direction: column; gap: 6px; }
  .stance .l { font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #B6B9B5; font-size: 13px; }
  .seg span { padding: 6px 0; text-align: center; color: var(--muted); }
  .seg span.on { background: var(--forest); color: #F4F7FA; font-weight: 600; }

  .where .k { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .where .title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .where h1 { margin: 0; font: 900 34px/1.2 var(--serif); }
  .tag { padding: 1px 9px; font-size: 12px; font-weight: 500; border: 1px solid; }
  .tag.wild { border-color: #A9C4B2; background: #EEF4EF; color: #2F5D45; }
  .tag.human { border-color: #B9C7D3; background: #EEF2F6; color: #2E4A60; }
  .quote { margin: 10px 0 0; padding: 10px 0 10px 16px; border-left: 2px solid #B6B9B5; font: 500 16px/1.75 var(--serif); color: #30353A; max-width: 40em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions .note { font-size: 12px; color: var(--muted); }

  .map { padding: 10px; }
  .map .routes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px 10px; }
  .map .routes .l { font: 700 14px/1.4 var(--serif); color: var(--steel-d); margin-right: 6px; }
  .pill { min-height: 34px; padding: 0 12px; background: var(--surface-2); border: 1px solid #D7A9AE; border-radius: 3px; color: #7A2631; font-size: 14px; }
  .pill:hover { background: #FBEFF0; }
  .map svg { display: block; width: 100%; height: auto; }
  .map .node.open { cursor: pointer; }
  .map .node.open:hover circle.ring, .map .node.open:focus circle.ring { fill: #FBEFF0; }
  .map .node:focus { outline: none; }

  .here { display: flex; flex-direction: column; gap: 14px; padding: 16px 10px 18px; border-bottom: 1px solid var(--line-in); }
  .here .cnt { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: -2px; }
  .here .cnt b { font-weight: 600; color: var(--ink); }
  .who { display: flex; align-items: center; gap: 12px; padding-left: 4px; }
  .ava { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #E3E6E8; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--c); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; gap: 2px; }
  .who .nm b { font: 700 14px/1.3 var(--serif); overflow-wrap: anywhere; }
  .who .nm span { font-size: 12px; color: var(--muted); }
  .who .me { margin-left: auto; margin-right: 2px; padding: 1px 7px; border: 1px solid #B9C7D3; color: #2E4A60; font-size: 11px; border-radius: 2px; }

  .log { flex: 1; min-height: 360px; max-height: 560px; overflow-y: auto; padding: 18px 10px; display: flex; flex-direction: column; gap: 16px; font-size: 14px; line-height: 1.55; }
  .log .msg { display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere; }
  .log .msg b { font: 700 13px/1.4 var(--serif); color: var(--t); }
  .log .sys { text-align: center; color: var(--muted); font-size: 12px; }
  .say { display: flex; gap: 8px; margin-top: auto; padding: 10px 2px 2px; border-top: 1px solid var(--line-in); }
  .say .input { flex: 1; min-width: 0; min-height: 40px; font-size: 14px; }
  .say .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }

  /* ── 하단 메뉴 ── */
  .dock { background: rgba(250, 250, 249, .72); backdrop-filter: blur(6px); border-top: 3px double var(--line); }
  .dock .in { max-width: 1280px; margin: 0 auto; padding: 4px 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 6px; }
  .dock button {
    min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 7px;
    background: transparent; border: 0; border-bottom: 3px solid transparent;
    color: #363B40; font: 500 13px/1 var(--serif);
  }
  .dock button[aria-current="page"] {
    background: linear-gradient(180deg, rgba(60, 90, 115, 0) 0%, rgba(60, 90, 115, .08) 45%, rgba(60, 90, 115, .23) 100%);
    border-bottom-color: var(--steel-d); color: var(--steel-d); font-weight: 700;
  }

  .toast {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 20;
    max-width: calc(100% - 32px); padding: 10px 16px;
    background: rgba(31, 35, 38, .92); color: #F4F7FA; border-radius: 3px; font-size: 14px;
    display: flex; gap: 12px; align-items: center;
  }
  .toast .btn { min-height: 32px; padding: 0 10px; font-size: 13px; }

  @media (max-width: 860px) {
    .profile, .side { max-width: none; }
    .center { order: -1; }  /* 휴대폰에서는 지역과 지도를 먼저 */
    .where h1 { font-size: 28px; }
    .log { min-height: 260px; max-height: 360px; }
  }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="auth" class="frame gate" hidden>
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <div class="brand"><svg width="34" height="38" viewBox="0 0 34 38" fill="none" aria-hidden="true"><path d="M17 2l14 5v11c0 9-6 15-14 18C9 33 3 27 3 18V7z" fill="#F7F7F5" stroke="#3C5A73" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 6l10 3.6V18c0 6.8-4.4 11.4-10 13.8C11.4 29.4 7 24.8 7 18V9.6z" stroke="#9DB3C6"/><path d="M11 21c3-1 4-4 6-7 2 3 3 6 6 7-2 0-4 1-6 4-2-3-4-4-6-4z" fill="#3C5A73"/></svg><span class="t">용의 대륙</span></div>
  <p class="lead">드래곤이 되어 대륙을 떠돌고, 인간과 어울리거나 멀리하며 살아가는 곳.</p>
  <form id="auth-form">
    <label class="field"><span>아이디</span><input class="input" name="username" autocomplete="username" required maxlength="16"></label>
    <label class="field"><span>비밀번호</span><input class="input" name="password" type="password" autocomplete="current-password" required maxlength="64"></label>
    <p class="error" id="auth-error" role="alert"></p>
    <div class="row">
      <button class="btn primary" type="submit" data-mode="login">로그인</button>
      <button class="btn" type="submit" data-mode="register">계정 만들기</button>
    </div>
  </form>
</section>

<!-- 드래곤 만들기 -->
<section id="create" class="frame gate wide" hidden>
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <h1>어떤 드래곤으로 태어날까요</h1>
  <p class="lead">종류에 따라 처음 눈뜨는 땅과 타고난 능력이 달라요. 한 번 정하면 바꿀 수 없어요.</p>
  <form id="create-form">
    <div class="kinds" id="kinds" role="group" aria-label="드래곤 종류"></div>
    <label class="field"><span>이름 (2~12자)</span><input class="input" name="name" required maxlength="12" autocomplete="off"></label>
    <p class="error" id="create-error" role="alert"></p>
    <div class="row"><button class="btn primary" type="submit">이 드래곤으로 시작</button></div>
  </form>
</section>

<!-- 게임 -->
<div id="game" hidden style="min-height: 100vh; display: flex; flex-direction: column">
  <header class="top">
    <div class="in">
      <div class="brand">
        <svg width="34" height="38" viewBox="0 0 34 38" fill="none" aria-hidden="true"><path d="M17 2l14 5v11c0 9-6 15-14 18C9 33 3 27 3 18V7z" fill="#F7F7F5" stroke="#3C5A73" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 6l10 3.6V18c0 6.8-4.4 11.4-10 13.8C11.4 29.4 7 24.8 7 18V9.6z" stroke="#9DB3C6"/><path d="M11 21c3-1 4-4 6-7 2 3 3 6 6 7-2 0-4 1-6 4-2-3-4-4-6-4z" fill="#3C5A73"/></svg>
        <div><div class="t">용의 대륙</div><div class="s" id="online-count"></div></div>
      </div>
      <div class="chips">
        <div class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3C5A73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg><span class="l">행동력</span><span class="v" id="ap"></span></div>
        <div class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7E8389" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg><span class="l">금화</span><span class="v" id="gold"></span></div>
        <div class="menu-wrap">
          <button class="iconbtn" id="menu-btn" type="button" aria-label="설정" aria-expanded="false" aria-controls="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="menu frame" id="menu" hidden>
            <button type="button" id="logout">로그아웃</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main" style="flex: 1">
    <section class="frame profile" aria-label="드래곤 기록">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div class="orn-h"><h2>드래곤 기록</h2></div>
      <div>
        <button class="portrait" id="portrait" type="button" aria-label="드래곤 그림 바꾸기">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#7E8389" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
          <span class="hint">눌러서 그림 올리기</span>
          <span class="over">그림 바꾸기</span>
        </button>
        <input type="file" id="avatar-file" accept="image/*" hidden>
        <div class="nameplate">
          <span class="n" id="me-name"></span>

        <div class="attr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3C5A73" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 10a4.5 4.5 0 0 1 9 0a4.5 4.5 0 0 1 9 0"/><path d="M7.5 16a4.5 4.5 0 0 1 9 0"/><path d="M3 10v4M21 10v4"/></svg><b id="st-scale"></b><span>비늘</span></div>
        <div class="attr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3C5A73" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 13c4-6 10-8.5 18-9-1.5 4-4.5 6.5-8 7.5 3 0 5 .8 6 2-4 2.5-9.5 3-16-.5z"/></svg><b id="st-wing"></b><span>날개</span></div>
        <div class="attr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3C5A73" stroke-width="1.5" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg><b id="st-wisdom"></b><span>지혜</span></div>

      <div class="stance">
        <span class="l">인간을 대하는 방식</span>
        <div class="seg" id="stance"><span data-s="friendly">우호</span><span data-s="hermit">은둔</span><span data-s="hostile">적대</span></div>
      </div>
    </section>

    <div class="center">
      <section class="where" aria-label="현재 지역">
        <span class="k">지금 머무는 곳</span>
        <div class="title"><h1 id="region-name"></h1><span class="tag" id="region-tag"></span></div>
        <p class="quote" id="region-desc"></p>
      </section>
      <div class="actions" id="actions">
        <button class="btn primary" type="button" data-soon="탐사"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>탐사<span class="cost">−1</span></button>
        <button class="btn" type="button" data-soon="채집"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3A6B50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-13 14-14-1 8-6 14-14 14z"/><path d="M5 19l7-7"/></svg>채집<span class="cost">−1</span></button>
        <button class="btn" type="button" data-soon="사냥"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3C5A73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L19 5"/><path d="M14 5h5v5"/><path d="M4 15l5 5"/></svg>사냥<span class="cost">−2</span></button>
        <button class="btn" type="button" data-soon="둥지"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7E8389" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>둥지로</button>
        <span class="note">숫자는 쓰이는 행동력</span>

      <section class="frame map" aria-label="대륙 지도">
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
        <div class="routes" id="routes"><span class="l">날아갈 수 있는 곳</span></div>
        <svg viewBox="0 0 1000 640" role="img" aria-label="대륙 지도" id="map-svg"><g id="terrain"></g><g id="overlay"></g></svg>

    <aside class="frame side" aria-label="이곳의 드래곤과 이야기">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div class="orn-h" style="padding: 0 10px"><h2>이곳의 이야기</h2></div>
      <div class="here">
        <div class="cnt"><span>이곳의 드래곤</span><b id="here-n"></b></div>
        <div id="here" style="display: flex; flex-direction: column; gap: 14px"></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="say" id="say">
        <label class="sr" for="say-input">채팅 입력</label>
        <input class="input" id="say-input" maxlength="200" autocomplete="off" placeholder="말하기">
        <button class="btn green" type="submit">보내기</button>
      </form>
    </aside>
  </main>

  <nav class="dock" aria-label="주 메뉴">
    <div class="in">
      <button type="button" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l5-12 4 6 3-4 6 10z"/><circle cx="17" cy="6" r="2"/></svg>대륙</button>
      <button type="button" data-soon="둥지"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M5 20V10a7 7 0 0 1 14 0v10"/><path d="M10 20v-5a2 2 0 0 1 4 0v5"/></svg>둥지</button>
      <button type="button" data-soon="소지품"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>소지품</button>
      <button type="button" data-soon="제작"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l9-9"/><path d="M12 4l8 8-3 3-8-8z"/></svg>제작</button>
      <button type="button" data-soon="결투장"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>결투장</button>
      <button type="button" data-soon="동료"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><path d="M15 15c3 0 6 2 6 5"/></svg>동료</button>
    </div>
  </nav>
</div>

<div class="toast" id="toast" hidden><span id="toast-text"></span><button class="btn" id="toast-btn" type="button" hidden></button></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = 'dragon-token';
  const NS = 'http://www.w3.org/2000/svg';

  let socket = null;
  const S = { kinds: {}, regions: {}, me: null, region: null, occupants: [], counts: {}, pickKind: null };

  const store = {
    get() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
  };

  // 받침에 따라 조사 고르기
  function josa(word, a, b) {
    const c = word.charCodeAt(word.length - 1) - 0xac00;
    if (c < 0 || c > 11171) return `${a}(${b})`;
    return c % 28 ? a : b;
  }
  function ro(word) {
    const c = word.charCodeAt(word.length - 1) - 0xac00;
    if (c < 0 || c > 11171) return '(으)로';
    const j = c % 28;
    return j && j !== 8 ? '으로' : '로';
  }
  const avatarUrl = (d) => (d.av ? `/avatar/${d.id}?v=${d.av}` : null);

  function show(id) {
    for (const s of ['auth', 'create', 'game']) $(s).hidden = s !== id;
  }

  let toastTimer = null;
  function toast(text, action) {
    clearTimeout(toastTimer);
    $('toast-text').textContent = text;
    const b = $('toast-btn');
    b.hidden = !action;
    if (action) { b.textContent = action.label; b.onclick = action.run; }
    $('toast').hidden = false;
    if (!action) toastTimer = setTimeout(() => ($('toast').hidden = true), 2600);
  }
  const hideToast = () => ($('toast').hidden = true);

  // ── 로그인 ──
  $('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mode = e.submitter?.dataset.mode || 'login';
    const f = e.target;
    $('auth-error').textContent = '';
    try {
      const res = await fetch(`/api/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }),
      });
      const data = await res.json();
      if (!res.ok) return ($('auth-error').textContent = data.error || '다시 시도해 주세요.');
      store.set(data.token);
      f.reset();
      connect();
    } catch {
      $('auth-error').textContent = '서버에 연결하지 못했어요. 서버가 켜져 있는지 확인해 주세요.';
    }
  });

  // ── 설정 메뉴 ──
  $('menu-btn').addEventListener('click', () => {
    const open = $('menu').hidden;
    $('menu').hidden = !open;
    $('menu-btn').setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap')) { $('menu').hidden = true; $('menu-btn').setAttribute('aria-expanded', 'false'); }
  });
  $('logout').addEventListener('click', () => {
    const token = store.get();
    if (token) fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    store.clear();
    if (socket) socket.disconnect();
    socket = null;
    $('menu').hidden = true;
    show('auth');
  });

  // 아직 만들지 않은 기능
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-soon]');
    if (b) toast(`${b.dataset.soon}${josa(b.dataset.soon, '은', '는')} 다음 업데이트에서 열려요.`);
  });

  // ── 드래곤 만들기 ──
  function renderKinds() {
    const box = $('kinds');
    box.innerHTML = '';
    for (const [id, k] of Object.entries(S.kinds)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'kind';
      b.style.setProperty('--c', `var(--k-${id})`);
      b.setAttribute('aria-pressed', String(S.pickKind === id));
      b.innerHTML = '<span class="ring"></span><strong></strong><small class="b"></small><small class="d"></small>';
      b.querySelector('strong').textContent = k.name;
      b.querySelector('.b').textContent = `${k.breath} 브레스, ${S.regions[k.home].name}에서 시작`;
      b.querySelector('.d').textContent = k.desc;
      b.addEventListener('click', () => { S.pickKind = id; renderKinds(); });
      box.appendChild(b);
    }
  }
  $('create-form').addEventListener('submit', (e) => {
    e.preventDefault();
    $('create-error').textContent = '';
    if (!S.pickKind) return ($('create-error').textContent = '드래곤 종류를 골라 주세요.');
    socket.emit('dragon:create', { name: e.target.name.value, kind: S.pickKind }, (res) => {
      if (res.error) return ($('create-error').textContent = res.error);
      setMe(res.dragon);
      show('game');
    });
  });

  // ── 내 드래곤 ──
  function setMe(me) {
    S.me = me;
    const pct = (a, b) => `${Math.max(0, Math.min(100, (a / b) * 100))}%`;
    $('me-name').textContent = me.name;
    $('me-lv').textContent = `Lv. ${me.level}`;
    $('me-kind').textContent = S.kinds[me.kind]?.name || '';
    $('xp-bar').style.width = pct(me.xp, me.xpMax);
    $('xp-t').textContent = `${me.xp.toLocaleString()} / ${me.xpMax.toLocaleString()}`;
    $('hp-t').innerHTML = `<b>${me.hp}</b><span> / ${me.hpMax}</span>`;
    $('hp-bar').style.width = pct(me.hp, me.hpMax);
    $('en-t').innerHTML = `<b>${me.en}</b><span> / ${me.enMax}</span>`;
    $('en-bar').style.width = pct(me.en, me.enMax);
    for (const k of ['claw', 'scale', 'wing', 'wisdom']) $(`st-${k}`).textContent = me.stats[k];
    for (const s of $('stance').children) s.classList.toggle('on', s.dataset.s === me.stance);
    $('ap').textContent = `${me.ap} / ${me.apMax}`;
    $('gold').textContent = me.gold.toLocaleString();

    const p = $('portrait');
    const url = avatarUrl(me);
    let img = p.querySelector('img');
    if (url) {
      if (!img) { img = document.createElement('img'); img.alt = ''; p.prepend(img); }
      if (img.getAttribute('src') !== url) img.src = url;
      p.querySelector('.hint').hidden = true;
      p.querySelector('svg').style.visibility = 'hidden';
    } else if (img) {
      img.remove();
    }
  }

  // ── 프로필 그림 올리기: 256×256으로 줄여서 보냄 ──
  $('portrait').addEventListener('click', () => $('avatar-file').click());
  $('avatar-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const bmp = await createImageBitmap(file);
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const s = Math.min(bmp.width, bmp.height);
      c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
      let data = c.toDataURL('image/webp', 0.86);
      if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/jpeg', 0.86);
      socket.emit('dragon:avatar', { dataUrl: data }, (res) => {
        toast(res.error || '그림을 바꿨어요.');
      });
    } catch {
      toast('그림 파일을 읽지 못했어요. 다른 그림으로 해 주세요.');
    }
  });

  // ── 지역 ──
  function renderRegion() {
    const r = S.regions[S.region];
    $('region-name').textContent = r.name;
    const tag = $('region-tag');
    tag.textContent = r.tag;
    tag.className = `tag ${r.tag === '야생' ? 'wild' : 'human'}`;
    $('region-desc').textContent = `“${r.desc}”`;

    const routes = $('routes');
    routes.querySelectorAll('.pill').forEach((b) => b.remove());
    for (const id of r.links) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill';
      b.textContent = S.regions[id].name;
      b.setAttribute('aria-label', `${S.regions[id].name}${ro(S.regions[id].name)} 날아가기`);
      b.addEventListener('click', () => move(id));
      routes.appendChild(b);
    }
    renderOverlay();
  }

  // 지형 그림은 한 번만 불러오고, 길과 지역 표시는 위에 따로 그림
  fetch('/map-terrain.svg').then((r) => r.text()).then((t) => {
    $('terrain').innerHTML = t.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  }).catch(() => {});

  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    return e;
  }
  function renderOverlay() {
    const g = $('overlay');
    g.replaceChildren();
    if (!S.region) return;
    const here = S.regions[S.region];
    const drawn = new Set();
    for (const r of Object.values(S.regions)) {
      for (const id of r.links) {
        const key = [r.id, id].sort().join('|');
        if (drawn.has(key)) continue;
        drawn.add(key);
        const t = S.regions[id];
        const act = r.id === S.region || id === S.region;
        g.appendChild(el('line', {
          x1: r.x, y1: r.y, x2: t.x, y2: t.y, 'stroke-linecap': 'round',
          stroke: act ? '#B84653' : '#6E6A58', 'stroke-width': act ? 3.4 : 2,
          'stroke-dasharray': act ? '10 6' : '2 7', opacity: act ? 1 : 0.75,
        }));
      }
    }
    for (const r of Object.values(S.regions)) {
      const isHere = r.id === S.region;
      const isOpen = here.links.includes(r.id);
      const node = el('g', { class: `node${isOpen ? ' open' : ''}`, 'data-region': r.id });
      if (isOpen) {
        node.setAttribute('tabindex', '0');
        node.setAttribute('role', 'button');
        node.setAttribute('aria-label', `${r.name}${ro(r.name)} 날아가기`);
      }
      if (isHere) {
        node.append(
          el('circle', { cx: r.x, cy: r.y, r: 19, fill: '#3C5A73', stroke: '#F7F5EE', 'stroke-width': 3 }),
          el('circle', { cx: r.x, cy: r.y, r: 13, fill: 'none', stroke: '#C5D3DE', 'stroke-width': 1.5 }),
          el('path', { d: `M${r.x},${r.y - 7} l5,7 -5,7 -5,-7z`, fill: '#E6EDF2' }),
        );
      } else if (isOpen) {
        node.append(
          el('circle', { class: 'ring', cx: r.x, cy: r.y, r: 12, fill: '#F7F5EE', stroke: '#B84653', 'stroke-width': 3.2 }),
          el('circle', { cx: r.x, cy: r.y, r: 4, fill: '#B84653' }),
        );
      } else {
        node.append(
          el('circle', { cx: r.x, cy: r.y, r: 10, fill: '#F7F5EE', stroke: '#4F4B3E', 'stroke-width': 2 }),
          el('circle', { cx: r.x, cy: r.y, r: 3, fill: '#4F4B3E' }),
        );
      }
      const label = el('text', {
        x: r.x, y: r.y + (isHere ? 46 : isOpen ? 40 : 38), 'text-anchor': 'middle',
        'font-family': 'Noto Serif KR, serif', 'font-size': isHere ? 25 : isOpen ? 22 : 21,
        'font-weight': isHere || isOpen ? 700 : 400,
        fill: isHere ? '#2A4256' : isOpen ? '#1F2326' : '#4E5358',
        'paint-order': 'stroke', stroke: '#ECE7D3', 'stroke-width': 6, 'stroke-linejoin': 'round',
      }, r.name);
      node.appendChild(label);
      const n = S.counts[r.id] || 0;
      if (n && !isHere) {
        node.append(
          el('circle', { cx: r.x + 18, cy: r.y - 16, r: 11, fill: '#3C5A73', stroke: '#F7F5EE', 'stroke-width': 2 }),
          el('text', { x: r.x + 18, y: r.y - 11.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 600, fill: '#F4F7FA', 'font-family': 'IBM Plex Sans KR, sans-serif' }, String(n)),
        );
      }
      g.appendChild(node);
    }
  }
  $('overlay').addEventListener('click', (e) => {
    const n = e.target.closest('.node.open');
    if (n) move(n.dataset.region);
  });
  $('overlay').addEventListener('keydown', (e) => {
    const n = e.target.closest('.node.open');
    if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); move(n.dataset.region); }
  });
  function move(to) {
    socket.emit('move', { to }, (res) => { if (res.error) toast(res.error); });
  }

  // ── 이곳의 드래곤 ──
  function renderHere() {
    $('here-n').textContent = S.occupants.length;
    const box = $('here');
    box.replaceChildren();
    for (const d of S.occupants) {
      const row = document.createElement('div');
      row.className = 'who';
      const ava = document.createElement('div');
      ava.className = 'ava';
      ava.style.setProperty('--c', `var(--k-${d.kind})`);
      const url = avatarUrl(d);
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        ava.appendChild(img);
      } else {
        ava.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E8389" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>';
      }
      const nm = document.createElement('div');
      nm.className = 'nm';
      const b = document.createElement('b');
      b.textContent = d.name;
      const k = document.createElement('span');
      k.textContent = S.kinds[d.kind]?.name || '';
      nm.append(b, k);
      row.append(ava, nm);
      if (S.me && d.id === S.me.id) {
        const me = document.createElement('span');
        me.className = 'me';
        me.textContent = '나';
        row.appendChild(me);
      }
      box.appendChild(row);
    }
  }

  // ── 이야기 ──
  function addLine(node) {
    const log = $('log');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.appendChild(node);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  function addChat(m) {
    const p = document.createElement('div');
    p.className = 'msg';
    p.style.setProperty('--t', `var(--t-${m.kind})`);
    const b = document.createElement('b');
    b.textContent = m.name;
    const t = document.createElement('span');
    t.textContent = m.text;
    p.append(b, t);
    addLine(p);
  }
  function addSystem(text) {
    const p = document.createElement('div');
    p.className = 'sys';
    p.textContent = text;
    addLine(p);
  }
  $('say').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('say-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('chat', { text });
    input.value = '';
  });

  // ── 서버 연결 ──
  function connect() {
    if (socket) socket.disconnect();
    socket = io({ auth: { token: store.get() } });

    socket.on('connect', hideToast);
    socket.on('connect_error', (err) => {
      if (err.message === 'auth') {
        store.clear();
        socket.disconnect();
        show('auth');
      } else {
        toast('서버에 연결하지 못했어요. 다시 잇는 중이에요.');
      }
    });
    socket.on('disconnect', (reason) => {
      if (reason === 'io client disconnect' || reason === 'io server disconnect') return;
      toast('연결이 끊겼어요. 다시 잇는 중이에요.');
    });
    socket.on('kicked', () => {
      toast('다른 창에서 같은 드래곤으로 접속했어요.', {
        label: '이 창에서 다시 접속',
        run: () => { hideToast(); socket.connect(); },
      });
    });

    socket.on('init', (data) => {
      S.kinds = data.kinds;
      S.regions = data.regions;
      if (data.dragon) {
        setMe(data.dragon);
        show('game');
      } else {
        S.pickKind = null;
        renderKinds();
        show('create');
      }
    });
    socket.on('me', setMe);
    socket.on('region:state', (data) => {
      S.region = data.region;
      S.occupants = data.occupants;
      renderRegion();
      renderHere();
      $('log').replaceChildren();
      for (const m of data.history) addChat(m);
      addSystem(`${S.regions[data.region].name}에 내려앉았다`);
      $('log').scrollTop = $('log').scrollHeight;
    });
    socket.on('presence', (data) => {
      if (data.region !== S.region) return;
      S.occupants = data.occupants;
      renderHere();
    });
    socket.on('world:counts', (counts) => {
      S.counts = counts;
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      $('online-count').textContent = `지금 대륙에 ${total}마리`;
      renderOverlay();
    });
    socket.on('chat', addChat);
    socket.on('system', (m) => addSystem(m.text));
  }

  if (store.get()) connect();
  else show('auth');
})();
</script>
</body>
</html>
